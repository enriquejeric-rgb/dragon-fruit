<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <radialGradient id="bgLight" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#4B5563"/>
      <stop offset="60%" stop-color="#374151"/>
      <stop offset="100%" stop-color="#1F2937"/>
    </radialGradient>
    <radialGradient id="dfPinkGrad1" cx="42%" cy="46%" r="55%">
      <stop offset="0%" stop-color="#FF438A"/>
      <stop offset="45%" stop-color="#E61A66"/>
      <stop offset="85%" stop-color="#BE0D4E"/>
      <stop offset="100%" stop-color="#800632"/>
    </radialGradient>
    <linearGradient id="scaleGreenGrad1" x1="0%" y1="0%" x2="40%" y2="100%">
      <stop offset="0%" stop-color="#86EFAC"/>
      <stop offset="35%" stop-color="#22C55E"/>
      <stop offset="80%" stop-color="#15803D"/>
      <stop offset="100%" stop-color="#14532D"/>
    </linearGradient>
    <!-- Soft Hand holding the fruit -->
    <linearGradient id="handGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ECCFB3"/>
      <stop offset="60%" stop-color="#D9AC89"/>
      <stop offset="100%" stop-color="#BF8963"/>
    </linearGradient>
    <filter id="shadowFilter" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="15" stdDeviation="15" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="800" fill="url(#bgLight)"/>

  <!-- Hand silhouette in background holding fruit -->
  <g fill="url(#handGrad1)" opacity="0.95">
    <!-- Thumb on left -->
    <path d="M140 460 C120 420 145 370 170 380 C195 390 200 450 180 490 Z"/>
    <!-- Palm and wrist -->
    <path d="M120 540 C110 650 130 760 160 800 L320 800 C340 730 350 630 330 550 C260 560 180 570 120 540 Z"/>
    <!-- Fingers on right wrapping fruit -->
    <path d="M430 400 C465 420 470 460 440 480 C410 490 395 440 415 410 Z"/>
    <path d="M420 470 C455 490 460 530 430 550 C400 560 385 510 405 480 Z"/>
    <path d="M400 540 C430 560 435 600 405 615 C380 620 370 580 385 550 Z"/>
  </g>

  <!-- Dragon fruit main group with shadow -->
  <g filter="url(#shadowFilter)">
    <!-- Top stem / top crown scales -->
    <path d="M300 210 C270 150 240 100 270 70 C295 110 305 160 310 200 Z" fill="url(#scaleGreenGrad1)"/>
    <path d="M310 200 C330 140 370 90 340 60 C325 100 315 150 305 200 Z" fill="url(#scaleGreenGrad1)"/>
    <path d="M290 210 C240 160 190 140 180 120 C210 150 250 180 280 220 Z" fill="url(#scaleGreenGrad1)"/>
    <path d="M320 210 C370 160 420 140 430 120 C400 150 360 180 330 220 Z" fill="url(#scaleGreenGrad1)"/>

    <!-- Main Fruit Body (oval) -->
    <ellipse cx="305" cy="420" rx="145" ry="215" fill="url(#dfPinkGrad1)"/>

    <!-- Prominent curved bracts / scales across the body (Export Grade - all intact, healthy green tips) -->
    <!-- Left scales -->
    <path d="M190 310 C130 290 110 320 125 350 C150 360 185 345 205 330 Z" fill="url(#scaleGreenGrad1)"/>
    <path d="M175 420 C100 410 85 450 110 480 C135 490 170 460 195 440 Z" fill="url(#scaleGreenGrad1)"/>
    <path d="M200 520 C140 540 125 580 150 610 C180 610 205 570 220 540 Z" fill="url(#scaleGreenGrad1)"/>

    <!-- Right scales -->
    <path d="M420 310 C480 290 500 320 485 350 C460 360 425 345 405 330 Z" fill="url(#scaleGreenGrad1)"/>
    <path d="M435 420 C510 410 525 450 500 480 C475 490 440 460 415 440 Z" fill="url(#scaleGreenGrad1)"/>
    <path d="M410 520 C470 540 485 580 460 610 C430 610 405 570 390 540 Z" fill="url(#scaleGreenGrad1)"/>

    <!-- Center face scales -->
    <path d="M260 350 C230 380 240 420 270 425 C285 415 285 380 280 360 Z" fill="url(#scaleGreenGrad1)"/>
    <path d="M350 350 C380 380 370 420 340 425 C325 415 325 380 330 360 Z" fill="url(#scaleGreenGrad1)"/>
    <path d="M305 450 C280 490 290 530 315 540 C335 530 335 490 325 460 Z" fill="url(#scaleGreenGrad1)"/>
    <path d="M255 480 C230 520 240 560 265 565 C280 555 280 520 275 495 Z" fill="url(#scaleGreenGrad1)"/>
    <path d="M355 480 C380 520 370 560 345 565 C330 555 330 520 335 495 Z" fill="url(#scaleGreenGrad1)"/>

    <!-- Subtle specular highlight for fresh waxy skin -->
    <ellipse cx="270" cy="360" rx="40" ry="80" fill="#FFFFFF" opacity="0.15" transform="rotate(-15 270 360)"/>
  </g>
</svg>
