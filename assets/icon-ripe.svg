<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Background circle badge -->
    <radialGradient id="ripeBadgeBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF0F5"/>
      <stop offset="100%" stop-color="#FCE4EC"/>
    </radialGradient>

    <!-- Ripe fruit gradient -->
    <radialGradient id="ripeFruitGrad" cx="38%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#FF3B77"/>
      <stop offset="50%" stop-color="#E11D48"/>
      <stop offset="90%" stop-color="#9F1239"/>
    </radialGradient>

    <!-- Green scales gradient -->
    <linearGradient id="ripeScaleGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#BE123C"/>
      <stop offset="35%" stop-color="#F43F5E"/>
      <stop offset="70%" stop-color="#A3E635"/>
      <stop offset="100%" stop-color="#16A34A"/>
    </linearGradient>

    <filter id="badgeShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#BE123C" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Badge Background -->
  <circle cx="50" cy="50" r="46" fill="url(#ripeBadgeBg)" stroke="#F8BBD0" stroke-width="2"/>

  <!-- Ripe Dragon Fruit Icon -->
  <g filter="url(#badgeShadow)">
    <!-- Top crown scale -->
    <path d="M50 18 C44 8 36 6 38 4 C46 6 50 12 51 18 Z" fill="url(#ripeScaleGrad)"/>
    <path d="M51 18 C57 8 65 6 63 4 C55 6 52 12 50 18 Z" fill="url(#ripeScaleGrad)"/>

    <!-- Main Fruit Body -->
    <path d="M50 17 
             C70 20 80 40 79 62 
             C78 78 68 88 50 89 
             C32 88 22 78 21 62 
             C20 40 30 20 50 17 Z" 
          fill="url(#ripeFruitGrad)"/>

    <!-- Lateral Scales -->
    <path d="M26 34 C14 28 8 34 8 38 C16 40 24 38 31 37 Z" fill="url(#ripeScaleGrad)"/>
    <path d="M74 34 C86 28 92 34 92 38 C84 40 76 38 69 37 Z" fill="url(#ripeScaleGrad)"/>

    <path d="M22 52 C8 48 4 56 6 60 C14 62 22 58 27 56 Z" fill="url(#ripeScaleGrad)"/>
    <path d="M78 52 C92 48 96 56 94 60 C86 62 78 58 73 56 Z" fill="url(#ripeScaleGrad)"/>

    <path d="M26 70 C14 68 12 76 16 80 C24 78 30 74 34 70 Z" fill="url(#ripeScaleGrad)"/>
    <path d="M74 70 C86 68 88 76 84 80 C76 78 70 74 66 70 Z" fill="url(#ripeScaleGrad)"/>

    <!-- Center surface scales -->
    <path d="M42 32 C34 40 36 50 46 51 C50 48 48 38 47 33 Z" fill="url(#ripeScaleGrad)"/>
    <path d="M58 32 C66 40 64 50 54 51 C50 48 52 38 53 33 Z" fill="url(#ripeScaleGrad)"/>

    <path d="M49 51 C42 63 46 73 54 74 C58 70 56 60 54 53 Z" fill="url(#ripeScaleGrad)"/>

    <!-- Waxy specular highlight -->
    <path d="M33 30 C28 42 28 58 33 70" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.38"/>
  </g>
</svg>
